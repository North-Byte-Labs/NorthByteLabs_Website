<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ticket Tool – NorthByte Labs</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <style>
    /* ===== RESET & THEME ===== */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(145deg, #f0f4ff 0%, #e6edf9 100%);
      min-height: 100vh;
      padding: 20px;
      color: #1e293b;
    }
    .glass { background: rgba(255,255,255,0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.3); box-shadow: 0 8px 32px rgba(0,0,0,0.06); border-radius: 20px; padding: 20px; transition: all 0.2s ease; }
    .glass:hover { box-shadow: 0 12px 40px rgba(0,0,0,0.08); }
    .btn { padding: 8px 18px; border: none; border-radius: 40px; font-weight: 600; font-size: 0.9rem; cursor: pointer; transition: all 0.15s ease; background: #e2e8f0; color: #1e293b; font-family: inherit; }
    .btn-primary { background: #3b82f6; color: white; }
    .btn-primary:hover { background: #2563eb; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(59,130,246,0.3); }
    .btn-success { background: #22c55e; color: white; }
    .btn-success:hover { background: #16a34a; }
    .btn-danger { background: #ef4444; color: white; }
    .btn-danger:hover { background: #dc2626; }
    .btn-outline { background: transparent; border: 1.5px solid #94a3b8; }
    .btn-outline:hover { background: #f1f5f9; }
    .btn-sm { padding: 4px 12px; font-size: 0.8rem; }
    .btn-xs { padding: 2px 10px; font-size: 0.7rem; }
    .app { max-width: 1400px; margin: 0 auto; }
    header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; margin-bottom: 30px; }
    header h1 { font-size: 2rem; font-weight: 700; background: linear-gradient(135deg, #3b82f6, #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .header-actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .header-actions a { text-decoration: none; }
    .tab-bar { display: flex; gap: 6px; margin-bottom: 25px; border-bottom: 2px solid rgba(255,255,255,0.3); padding-bottom: 4px; }
    .tab { padding: 10px 24px; border-radius: 40px 40px 0 0; font-weight: 600; cursor: pointer; transition: all 0.2s; color: #64748b; font-family: inherit; }
    .tab.active { background: white; color: #1e293b; box-shadow: 0 -2px 12px rgba(0,0,0,0.04); }
    .tab:hover:not(.active) { background: rgba(255,255,255,0.3); }
    .page { display: none; }
    .page.active { display: block; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 16px; margin-bottom: 20px; }
    .stat-card { text-align: center; padding: 16px 8px; background: rgba(255,255,255,0.5); border-radius: 16px; backdrop-filter: blur(4px); border: 1px solid rgba(255,255,255,0.3); }
    .stat-card .number { font-size: 2rem; font-weight: 700; }
    .stat-card .label { font-size: 0.8rem; color: #64748b; }
    .chart-container { max-width: 300px; margin: 0 auto 20px; background: rgba(255,255,255,0.4); border-radius: 16px; padding: 12px; }
    .dashboard-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 18px; }
    .column { background: rgba(255,255,255,0.3); backdrop-filter: blur(4px); border-radius: 16px; padding: 14px; border: 1px solid rgba(255,255,255,0.2); min-height: 200px; }
    .column h3 { font-size: 1rem; font-weight: 600; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
    .column h3 .count { background: rgba(0,0,0,0.06); padding: 2px 10px; border-radius: 20px; font-size: 0.75rem; }
    .column.drag-over { background: rgba(59,130,246,0.08); border: 2px dashed #3b82f6; }
    .ticket-card {
      background: white;
      border-radius: 12px;
      padding: 12px 14px 0 14px;
      margin-bottom: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.02);
      border-left: 4px solid #3b82f6;
      transition: all 0.15s;
      cursor: grab;
      position: relative;
    }
    .ticket-card:active { cursor: grabbing; }
    .ticket-card:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,0.06); }
    .ticket-card .id { font-size: 0.7rem; font-weight: 600; color: #3b82f6; }
    .ticket-card .summary { font-weight: 500; margin: 4px 0; }
    .ticket-card .meta { font-size: 0.7rem; color: #94a3b8; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
    .ticket-card .assignee-initials { display: inline-block; width: 26px; height: 26px; border-radius: 50%; background: #3b82f6; color: white; font-size: 0.7rem; font-weight: 600; line-height: 26px; text-align: center; }
    .ticket-card .impediment { background: #fef2f2; color: #dc2626; padding: 0 6px; border-radius: 4px; font-size: 0.65rem; font-weight: 600; }
    .ticket-card.dragging { opacity: 0.5; transform: scale(0.95); }
    .eta-bar {
      height: 3px;
      margin-top: 10px;
      border-radius: 0 0 12px 12px;
      width: calc(100% + 28px);
      margin-left: -14px;
      transition: background 0.3s;
    }
    .eta-bar.green { background: #22c55e; }
    .eta-bar.yellow { background: #eab308; }
    .eta-bar.orange { background: #f97316; }
    .eta-bar.red { background: #ef4444; }
    .eta-bar.none { background: #e5e7eb; }

    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .form-grid .full { grid-column: 1 / -1; }
    .form-group { display: flex; flex-direction: column; gap: 4px; }
    .form-group label { font-weight: 500; font-size: 0.85rem; color: #475569; }
    .form-group input, .form-group textarea, .form-group select { padding: 10px 14px; border: 1px solid #e2e8f0; border-radius: 12px; background: rgba(255,255,255,0.6); backdrop-filter: blur(4px); font-family: inherit; font-size: 0.95rem; transition: border 0.2s; }
    .form-group input:focus, .form-group textarea:focus, .form-group select:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }
    .form-actions { display: flex; gap: 12px; margin-top: 16px; flex-wrap: wrap; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid rgba(0,0,0,0.04); }
    th { background: rgba(255,255,255,0.3); font-weight: 600; color: #475569; }
    tr:hover { background: rgba(255,255,255,0.2); }
    .state-badge { padding: 2px 12px; border-radius: 20px; font-size: 0.7rem; font-weight: 600; display: inline-block; }
    .state-todo { background: #e2e8f0; color: #475569; }
    .state-inprogress { background: #bfdbfe; color: #1d4ed8; }
    .state-pendingonuser { background: #fef3c7; color: #b45309; }
    .state-completed { background: #bbf7d0; color: #15803d; }
    .state-closed { background: #e5e7eb; color: #6b7280; }
    .actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.3); backdrop-filter: blur(6px); align-items: center; justify-content: center; z-index: 999; }
    .modal-overlay.open { display: flex; }
    .modal { max-width: 600px; width: 90%; max-height: 90vh; overflow-y: auto; background: white; border-radius: 28px; padding: 30px; box-shadow: 0 40px 80px rgba(0,0,0,0.15); animation: fadeUp 0.25s ease; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .text-muted { color: #94a3b8; font-size: 0.8rem; }
    .mt-4 { margin-top: 16px; }
    .flex { display: flex; }
    .flex-between { display: flex; justify-content: space-between; align-items: center; }
    .gap-2 { gap: 8px; }
    .gap-4 { gap: 16px; }
    .flex-wrap { flex-wrap: wrap; }
    .w-full { width: 100%; }
    .hidden { display: none; }
    .mb-2 { margin-bottom: 8px; }
    .text-sm { font-size: 0.9rem; }
    .text-gray-500 { color: #64748b; }
    pre { background: #f1f5f9; padding: 12px; border-radius: 8px; overflow-x: auto; font-size: 0.8rem; white-space: pre-wrap; word-break: break-all; }
    .comment { background: #f8fafc; border-radius: 8px; padding: 8px 12px; margin-bottom: 8px; }
    .comment .meta { font-size: 0.7rem; color: #94a3b8; }
    @media (max-width: 640px) { .form-grid { grid-template-columns: 1fr; } header { flex-direction: column; align-items: stretch; gap: 12px; } .dashboard-cards { grid-template-columns: 1fr; } }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: rgba(0,0,0,0.02); border-radius: 8px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; }

    /* Login Overlay */
    #loginPage { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    #loginPage .login-box { max-width: 420px; width: 100%; }
    #loginPage h2 { text-align: center; margin-bottom: 24px; font-weight: 700; background: linear-gradient(135deg, #3b82f6, #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 1.8rem; }
    #loginPage .form-group { margin-bottom: 16px; }
    #loginPage .form-group label { display: block; font-weight: 500; margin-bottom: 4px; color: #475569; }
    #loginPage .form-group input { width: 100%; padding: 12px 16px; border: 1px solid #e2e8f0; border-radius: 12px; background: rgba(255,255,255,0.6); font-size: 1rem; font-family: inherit; transition: border 0.2s; }
    #loginPage .form-group input:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }
    #loginPage .btn { width: 100%; padding: 12px; border: none; border-radius: 40px; font-weight: 600; font-size: 1rem; cursor: pointer; background: #3b82f6; color: white; transition: all 0.15s; font-family: inherit; }
    #loginPage .btn:hover { background: #2563eb; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(59,130,246,0.3); }
    #loginPage .error { color: #dc2626; font-size: 0.9rem; margin-top: 8px; text-align: center; }
    body.logged-in #loginPage { display: none; }
    body.logged-in #app { display: block; }
    #app { display: none; }

    .pending-on-group { display: none; }
    .pending-on-group.show { display: block; }

    /* Name prompt modal */
    #namePromptModal .modal { max-width: 400px; }
  </style>
</head>
<body>

  <!-- LOGIN PAGE -->
  <div id="loginPage">
    <div class="login-box glass">
      <h2>🔐 Access Required</h2>
      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" placeholder="Enter username" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter password" required>
        </div>
        <button type="submit" class="btn">Sign In</button>
        <div id="loginError" class="error"></div>
      </form>
    </div>
  </div>

  <!-- MAIN APP -->
  <div id="app">
    <div class="app">

      <!-- Header -->
      <header>
        <h1>🎫 Ticket Tool</h1>
        <div class="header-actions">
          <button class="btn btn-outline btn-sm" onclick="showProfileModal()">👤 Profile</button>
          <button class="btn btn-outline btn-sm" onclick="exportData()">📤 Export All Tickets</button>
          <button class="btn btn-outline btn-sm" onclick="refreshDashboard()">🔄 Refresh</button>
          <button class="btn btn-outline btn-sm" onclick="logout()">🚪 Logout</button>
        </div>
      </header>

      <!-- Tab Bar -->
      <div class="tab-bar">
        <div class="tab active" data-tab="dashboard" onclick="switchTab('dashboard')">📊 Dashboard</div>
        <div class="tab" data-tab="tickets" onclick="switchTab('tickets')">📋 All Tickets</div>
        <div class="tab" data-tab="create" onclick="switchTab('create')">➕ Create Ticket</div>
      </div>

      <!-- Dashboard -->
      <div id="page-dashboard" class="page active">
        <div class="stats-grid" id="statsGrid"></div>
        <div class="chart-container"><canvas id="stateChart" width="300" height="200"></canvas></div>
        <div class="dashboard-cards" id="dashboardColumns"></div>
      </div>

      <!-- Tickets Table with Filters & Reports -->
      <div id="page-tickets" class="page">
        <div class="glass">
          <div class="flex-between flex-wrap gap-2">
            <h3>All Tickets</h3>
            <div class="flex gap-2 flex-wrap">
              <select id="statusFilter" onchange="renderTable()" class="btn btn-outline" style="padding: 6px 14px;">
                <option value="all">All Statuses</option>
                <option value="open">Open (To Do / In Progress / Pending)</option>
                <option value="closed">Closed / Completed</option>
              </select>
              <select id="dateFilterType" onchange="toggleDateFilter()" class="btn btn-outline" style="padding: 6px 14px;">
                <option value="created">Created Date</option>
                <option value="completed">Completed Date</option>
              </select>
              <button class="btn btn-outline btn-sm" onclick="downloadReport('1d')">📊 Last 1 Day</button>
              <button class="btn btn-outline btn-sm" onclick="downloadReport('7d')">📊 Last 7 Days</button>
              <button class="btn btn-outline btn-sm" onclick="downloadReport('30d')">📊 Last 30 Days</button>
              <button class="btn btn-outline btn-sm" onclick="showCustomReport()">📊 Custom Range</button>
            </div>
          </div>
          <div class="flex-between flex-wrap gap-2 mt-2">
            <div class="flex gap-2">
              <input type="text" id="searchInput" placeholder="Search summary or ID..." oninput="renderTable()" class="btn btn-outline" style="padding: 6px 14px; border-radius: 40px;">
              <select id="stateFilter" onchange="renderTable()" class="btn btn-outline" style="padding: 6px 14px;">
                <option value="all">All states</option>
                <option value="To Do">To Do</option>
                <option value="In Progress">In Progress</option>
                <option value="Pending on user">Pending on user</option>
                <option value="Completed">Completed</option>
                <option value="Closed">Closed</option>
              </select>
            </div>
            <div class="flex gap-2" id="customDateRange" style="display:none;">
              <input type="date" id="reportStartDate">
              <input type="date" id="reportEndDate">
              <button class="btn btn-sm btn-primary" onclick="downloadReport('custom')">Apply</button>
            </div>
          </div>
          <div class="table-wrap mt-4">
            <table id="ticketTable">
              <thead><tr><th>ID</th><th>Summary</th><th>State</th><th>Assignee</th><th>ETA</th><th>Created</th><th>Completed</th><th>Actions</th></tr></thead>
              <tbody id="ticketTableBody"></tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- Create / Edit -->
      <div id="page-create" class="page">
        <div class="glass">
          <h3 id="formTitle">Create New Ticket</h3>
          <form id="ticketForm" onsubmit="saveTicket(event)">
            <div class="form-grid">
              <div class="form-group full">
                <label for="summary">Summary *</label>
                <input type="text" id="summary" required placeholder="What's the issue?">
              </div>
              <div class="form-group full">
                <label for="description">Description</label>
                <textarea id="description" rows="3" placeholder="Detailed description..."></textarea>
              </div>
              <div class="form-group">
                <label for="assignee">Assignee</label>
                <input type="text" id="assignee" placeholder="Name (e.g., John Doe)">
              </div>
              <div class="form-group">
                <label for="eta">ETA</label>
                <input type="date" id="eta">
              </div>
              <div class="form-group">
                <label for="state">State</label>
                <select id="state" onchange="togglePendingOn()">
                  <option value="To Do">To Do</option>
                  <option value="In Progress">In Progress</option>
                  <option value="Pending on user">Pending on user</option>
                  <option value="Completed">Completed</option>
                  <option value="Closed" disabled>Closed (locked)</option>
                </select>
              </div>
              <div class="form-group pending-on-group" id="pendingOnGroup">
                <label for="pendingOn">Pending on (name)</label>
                <input type="text" id="pendingOn" placeholder="Who is this pending on?">
              </div>
              <div class="form-group full">
                <label for="impediment">Impediment Comment</label>
                <textarea id="impediment" rows="2" placeholder="Any blockers?"></textarea>
              </div>
            </div>
            <input type="hidden" id="editId" value="">
            <div class="form-actions">
              <button type="submit" class="btn btn-primary" id="submitBtn">Create Ticket</button>
              <button type="button" class="btn btn-outline" onclick="resetForm()">Cancel</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Modal: Detail -->
    <div class="modal-overlay" id="detailModal">
      <div class="modal" id="detailContent"></div>
    </div>

    <!-- Modal: Profile -->
    <div class="modal-overlay" id="profileModal">
      <div class="modal">
        <h3>👤 Your Profile</h3>
        <div class="form-group">
          <label for="profileName">Your Name (for comments)</label>
          <input type="text" id="profileName" placeholder="Enter your name">
        </div>
        <div class="flex gap-2 mt-4">
          <button class="btn btn-primary" onclick="saveProfile()">Save</button>
          <button class="btn btn-outline" onclick="closeProfileModal()">Cancel</button>
        </div>
      </div>
    </div>

    <!-- Modal: First-time Name Prompt -->
    <div class="modal-overlay" id="namePromptModal">
      <div class="modal">
        <h3>👋 Welcome!</h3>
        <p>Please enter your name – it will appear on your comments.</p>
        <div class="form-group">
          <label for="namePromptInput">Your Name</label>
          <input type="text" id="namePromptInput" placeholder="e.g., John Doe">
        </div>
        <div class="flex gap-2 mt-4">
          <button class="btn btn-primary" onclick="saveNameFromPrompt()">Save</button>
        </div>
      </div>
    </div>

    <!-- Modal: ETA Notification -->
    <div class="modal-overlay" id="etaNotificationModal">
      <div class="modal">
        <h3>⏰ ETA Expiry Alert</h3>
        <div id="etaNotificationContent"></div>
        <div class="flex gap-2 mt-4">
          <button class="btn btn-primary" onclick="closeEtaNotification()">OK</button>
        </div>
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script>

    const _a = atob('YWRtaW4=');
    const _b = atob('YWRtaW5AMjkxODc=');

    function handleLogin(e) {
      e.preventDefault();
      const u = document.getElementById('username').value.trim();
      const p = document.getElementById('password').value.trim();
      if (u === _a && p === _b) {
        sessionStorage.setItem('ticketLoggedIn', 'true');
        document.body.classList.add('logged-in');
        if (typeof initApp === 'function') initApp();
        document.getElementById('loginError').textContent = '';
      } else {
        document.getElementById('loginError').textContent = 'Invalid credentials.';
      }
    }

    function logout() {
      sessionStorage.removeItem('ticketLoggedIn');
      document.body.classList.remove('logged-in');
    }

    if (sessionStorage.getItem('ticketLoggedIn') === 'true') {
      document.body.classList.add('logged-in');
    }

    // -------- TICKET TOOL (Hard Delete) --------
    const STORAGE_KEY = 'ticketToolData';
    const COUNTER_KEY = 'ticketCounter';
    const PROFILE_KEY = 'ticketProfileName';
    let tickets = [];
    let chartInstance = null;
    let currentUser = localStorage.getItem(PROFILE_KEY) || '';

    function loadData() {
      const stored = localStorage.getItem(STORAGE_KEY);
      if (stored) {
        try { tickets = JSON.parse(stored); } catch(e) { tickets = []; }
      }
      tickets = tickets.map(t => ({
        ...t,
        description: t.description || '',
        assignee: t.assignee || '',
        completedTime: t.completedTime || null,
        impediment: t.impediment || '',
        state: t.state || 'To Do',
        eta: t.eta || '',
        summary: t.summary || 'Untitled',
        createTime: t.createTime || new Date().toISOString(),
        id: t.id || 'TKT-00001',
        pendingOn: t.pendingOn || '',
        comments: t.comments || []
      }));
      saveData();
    }

    function saveData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tickets));
    }

    function getNextTicketNumber() {
      let counter = parseInt(localStorage.getItem(COUNTER_KEY) || '0', 10);
      counter++;
      localStorage.setItem(COUNTER_KEY, String(counter));
      return 'TKT-' + String(counter).padStart(5, '0');
    }

    function getActiveTickets() {
      return tickets;
    }

    function createTicket(data) {
      const now = new Date().toISOString();
      const ticket = {
        id: getNextTicketNumber(),
        summary: data.summary,
        description: data.description || '',
        assignee: data.assignee || '',
        eta: data.eta || '',
        state: data.state || 'To Do',
        impediment: data.impediment || '',
        createTime: now,
        completedTime: data.state === 'Completed' ? now : null,
        pendingOn: data.pendingOn || '',
        comments: []
      };
      tickets.push(ticket);
      saveData();
      return ticket;
    }

    function updateTicket(id, updates) {
      const idx = tickets.findIndex(t => t.id === id);
      if (idx === -1) return null;
      const old = tickets[idx];
      if (old.state === 'Closed') return null;
      if (updates.state === 'Completed' && old.state !== 'Completed') {
        updates.completedTime = new Date().toISOString();
      }
      updates.comments = old.comments;
      tickets[idx] = { ...old, ...updates };
      saveData();
      return tickets[idx];
    }

    function deleteTicket(id) {
      const idx = tickets.findIndex(t => t.id === id);
      if (idx === -1) return;
      tickets.splice(idx, 1);
      saveData();
    }

    function addComment(ticketId, text) {
      const idx = tickets.findIndex(t => t.id === ticketId);
      if (idx === -1) return;
      const comment = {
        text: text,
        user: currentUser || 'User',
        timestamp: new Date().toISOString()
      };
      tickets[idx].comments.push(comment);
      saveData();
      const modal = document.getElementById('detailModal');
      if (modal.classList.contains('open')) {
        openDetail(ticketId);
      }
    }

    function applyLifecycle() {
      let changed = false;
      const now = new Date();
      tickets.forEach(t => {
        if (t.state === 'Completed' && t.completedTime) {
          const completedDate = new Date(t.completedTime);
          const diffDays = (now - completedDate) / (1000 * 60 * 60 * 24);
          if (diffDays >= 7) {
            t.state = 'Closed';
            changed = true;
          }
        }
      });
      if (changed) saveData();
    }

    function getInitials(name) {
      if (!name) return '?';
      const parts = name.trim().split(/\s+/);
      if (parts.length === 1) return parts[0].charAt(0).toUpperCase();
      return (parts[0].charAt(0) + parts[parts.length-1].charAt(0)).toUpperCase();
    }

    // -------- ETA color & expiry --------
    function getEtaStatus(etaStr) {
      if (!etaStr) return { color: 'none', daysLeft: Infinity };
      const now = new Date();
      const eta = new Date(etaStr);
      const diffMs = eta - now;
      const daysLeft = diffMs / (1000 * 60 * 60 * 24);
      if (daysLeft < 0) return { color: 'red', daysLeft };
      if (daysLeft <= 2) return { color: 'orange', daysLeft };
      if (daysLeft <= 4) return { color: 'yellow', daysLeft };
      return { color: 'green', daysLeft };
    }

    function checkEtaNotifications() {
      const now = new Date();
      const expiring = tickets.filter(t => {
        if (!t.eta) return false;
        const eta = new Date(t.eta);
        const diffDays = (eta - now) / (1000 * 60 * 60 * 24);
        return diffDays >= 0 && diffDays <= 2;
      });
      if (expiring.length > 0) {
        const modal = document.getElementById('etaNotificationModal');
        const content = document.getElementById('etaNotificationContent');
        content.innerHTML = `<p>The following tickets have ETA within 2 days:</p><ul>${expiring.map(t => `<li><strong>${t.id}</strong> – ${t.summary} (ETA: ${new Date(t.eta).toLocaleDateString()})</li>`).join('')}</ul>`;
        modal.classList.add('open');
      }
    }

    // -------- Dashboard --------
    function renderStats() {
      const active = getActiveTickets();
      const stats = {
        total: active.length,
        todo: active.filter(t => t.state === 'To Do').length,
        progress: active.filter(t => t.state === 'In Progress').length,
        pending: active.filter(t => t.state === 'Pending on user').length,
        completed: active.filter(t => t.state === 'Completed').length,
        closed: active.filter(t => t.state === 'Closed').length,
      };
      const grid = document.getElementById('statsGrid');
      grid.innerHTML = `
        <div class="stat-card"><div class="number">${stats.total}</div><div class="label">Total</div></div>
        <div class="stat-card"><div class="number" style="color:#475569">${stats.todo}</div><div class="label">To Do</div></div>
        <div class="stat-card"><div class="number" style="color:#1d4ed8">${stats.progress}</div><div class="label">In Progress</div></div>
        <div class="stat-card"><div class="number" style="color:#b45309">${stats.pending}</div><div class="label">Pending</div></div>
        <div class="stat-card"><div class="number" style="color:#15803d">${stats.completed}</div><div class="label">Completed</div></div>
        <div class="stat-card"><div class="number" style="color:#6b7280">${stats.closed}</div><div class="label">Closed</div></div>
      `;
      updateChart(active);
    }

    function updateChart(active) {
      const stateCounts = {};
      active.forEach(t => {
        stateCounts[t.state] = (stateCounts[t.state] || 0) + 1;
      });
      const labels = Object.keys(stateCounts);
      const data = Object.values(stateCounts);
      const colors = {
        'To Do': '#475569',
        'In Progress': '#1d4ed8',
        'Pending on user': '#b45309',
        'Completed': '#15803d',
        'Closed': '#6b7280'
      };
      const backgroundColors = labels.map(label => colors[label] || '#94a3b8');

      const ctx = document.getElementById('stateChart').getContext('2d');
      if (chartInstance) chartInstance.destroy();
      if (labels.length === 0) return;
      chartInstance = new Chart(ctx, {
        type: 'pie',
        data: {
          labels: labels,
          datasets: [{
            data: data,
            backgroundColor: backgroundColors,
            borderWidth: 1
          }]
        },
        options: {
          responsive: true,
          plugins: {
            legend: { position: 'bottom' },
            title: { display: true, text: 'Ticket States Distribution' }
          }
        }
      });
    }

    function renderDashboard() {
      const active = getActiveTickets();
      const states = ['To Do', 'In Progress', 'Pending on user', 'Completed', 'Closed'];
      const container = document.getElementById('dashboardColumns');
      container.innerHTML = '';
      const colorMap = {
        'To Do': '#475569',
        'In Progress': '#1d4ed8',
        'Pending on user': '#b45309',
        'Completed': '#15803d',
        'Closed': '#6b7280'
      };
      states.forEach(state => {
        const cards = active.filter(t => t.state === state);
        const col = document.createElement('div');
        col.className = 'column';
        col.dataset.state = state;
        col.innerHTML = `
          <h3>${state} <span class="count">${cards.length}</span></h3>
          <div class="column-inner">
            ${cards.map(t => {
              const etaStatus = getEtaStatus(t.eta);
              const barClass = etaStatus.color;
              const pendingLabel = state === 'Pending on user' && t.pendingOn ? ` (on ${t.pendingOn})` : '';
              return `
                <div class="ticket-card" draggable="true" data-id="${t.id}" style="border-left-color: ${colorMap[state]}" onclick="openDetail('${t.id}')">
                  <div class="id">${t.id}</div>
                  <div class="summary">${t.summary}${pendingLabel}</div>
                  <div class="meta">
                    <span class="assignee-initials">${getInitials(t.assignee)}</span>
                    <span>${t.eta ? '📅 '+t.eta : ''}</span>
                    ${t.impediment ? '<span class="impediment">⚠️</span>' : ''}
                  </div>
                  <div class="eta-bar ${barClass}"></div>
                </div>
              `;
            }).join('')}
            ${cards.length === 0 ? '<div class="text-muted" style="padding: 10px 0; text-align:center;">— empty —</div>' : ''}
          </div>
        `;
        container.appendChild(col);
      });
      attachDragDrop();
    }

    function attachDragDrop() {
      const cards = document.querySelectorAll('.ticket-card');
      cards.forEach(card => {
        card.addEventListener('dragstart', handleDragStart);
        card.addEventListener('dragend', handleDragEnd);
      });
      const columns = document.querySelectorAll('.column');
      columns.forEach(col => {
        col.addEventListener('dragover', handleDragOver);
        col.addEventListener('dragenter', handleDragEnter);
        col.addEventListener('dragleave', handleDragLeave);
        col.addEventListener('drop', handleDrop);
      });
    }

    let draggedId = null;

    function handleDragStart(e) {
      draggedId = e.target.closest('.ticket-card').dataset.id;
      e.dataTransfer.effectAllowed = 'move';
      e.target.classList.add('dragging');
    }

    function handleDragEnd(e) {
      e.target.classList.remove('dragging');
      document.querySelectorAll('.column').forEach(c => c.classList.remove('drag-over'));
    }

    function handleDragOver(e) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; }
    function handleDragEnter(e) { e.preventDefault(); e.currentTarget.classList.add('drag-over'); }
    function handleDragLeave(e) { e.currentTarget.classList.remove('drag-over'); }

    function handleDrop(e) {
      e.preventDefault();
      e.currentTarget.classList.remove('drag-over');
      const column = e.currentTarget;
      const newState = column.dataset.state;
      if (!draggedId) return;
      const ticket = tickets.find(t => t.id === draggedId);
      if (!ticket) return;
      if (ticket.state === 'Closed') { alert('Closed tickets cannot be moved.'); return; }
      if (ticket.state !== newState) {
        updateTicket(draggedId, { state: newState });
        refreshDashboard();
      }
      draggedId = null;
    }

    // -------- Table with filters --------
    function renderTable() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const stateFilter = document.getElementById('stateFilter').value;
      const statusFilter = document.getElementById('statusFilter').value;
      let active = getActiveTickets();
      if (stateFilter !== 'all') active = active.filter(t => t.state === stateFilter);
      if (statusFilter === 'open') {
        active = active.filter(t => ['To Do','In Progress','Pending on user'].includes(t.state));
      } else if (statusFilter === 'closed') {
        active = active.filter(t => ['Completed','Closed'].includes(t.state));
      }
      if (search) active = active.filter(t => 
        t.id.toLowerCase().includes(search) || 
        t.summary.toLowerCase().includes(search)
      );
      const tbody = document.getElementById('ticketTableBody');
      tbody.innerHTML = active.map(t => `
        <tr>
          <td><strong>${t.id}</strong></td>
          <td>${t.summary}</td>
          <td><span class="state-badge state-${t.state.toLowerCase().replace(/ /g,'')}">${t.state}</span></td>
          <td>${t.assignee || '-'}</td>
          <td>${t.eta || '-'}</td>
          <td>${new Date(t.createTime).toLocaleDateString()}</td>
          <td>${t.completedTime ? new Date(t.completedTime).toLocaleDateString() : '-'}</td>
          <td class="actions">
            <button class="btn btn-primary btn-xs" onclick="openDetail('${t.id}')">View</button>
            <button class="btn btn-outline btn-xs" onclick="editTicket('${t.id}')">Edit</button>
            <button class="btn btn-danger btn-xs" onclick="deleteTicket('${t.id}'); renderTable(); refreshDashboard();">Delete</button>
          </td>
        </tr>
      `).join('');
    }

    // -------- Reports --------
    function getFilteredForReport() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const stateFilter = document.getElementById('stateFilter').value;
      const statusFilter = document.getElementById('statusFilter').value;
      let active = getActiveTickets();
      if (stateFilter !== 'all') active = active.filter(t => t.state === stateFilter);
      if (statusFilter === 'open') {
        active = active.filter(t => ['To Do','In Progress','Pending on user'].includes(t.state));
      } else if (statusFilter === 'closed') {
        active = active.filter(t => ['Completed','Closed'].includes(t.state));
      }
      if (search) active = active.filter(t => 
        t.id.toLowerCase().includes(search) || 
        t.summary.toLowerCase().includes(search)
      );
      return active;
    }

    function downloadReport(range) {
      let filtered = getFilteredForReport();
      const now = new Date();
      let startDate = null;
      if (range === '1d') {
        startDate = new Date(now);
        startDate.setDate(startDate.getDate() - 1);
      } else if (range === '7d') {
        startDate = new Date(now);
        startDate.setDate(startDate.getDate() - 7);
      } else if (range === '30d') {
        startDate = new Date(now);
        startDate.setDate(startDate.getDate() - 30);
      } else if (range === 'custom') {
        const start = document.getElementById('reportStartDate').value;
        const end = document.getElementById('reportEndDate').value;
        if (!start || !end) { alert('Please select both dates.'); return; }
        const s = new Date(start);
        const e = new Date(end);
        e.setHours(23,59,59,999);
        const type = document.getElementById('dateFilterType').value;
        if (type === 'created') {
          filtered = filtered.filter(t => new Date(t.createTime) >= s && new Date(t.createTime) <= e);
        } else {
          filtered = filtered.filter(t => t.completedTime && new Date(t.completedTime) >= s && new Date(t.completedTime) <= e);
        }
        // generate report
        const dataStr = JSON.stringify(filtered, null, 2);
        const blob = new Blob([dataStr], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `report_${range}_${new Date().toISOString().slice(0,10)}.json`;
        a.click();
        URL.revokeObjectURL(a.href);
        return;
      }
      if (startDate) {
        const type = document.getElementById('dateFilterType').value;
        if (type === 'created') {
          filtered = filtered.filter(t => new Date(t.createTime) >= startDate);
        } else {
          filtered = filtered.filter(t => t.completedTime && new Date(t.completedTime) >= startDate);
        }
      }
      const dataStr = JSON.stringify(filtered, null, 2);
      const blob = new Blob([dataStr], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `report_${range}_${new Date().toISOString().slice(0,10)}.json`;
      a.click();
      URL.revokeObjectURL(a.href);
    }

    function showCustomReport() {
      document.getElementById('customDateRange').style.display = 'flex';
    }

    function toggleDateFilter() {}

    // -------- Form --------
    function togglePendingOn() {
      const state = document.getElementById('state').value;
      const group = document.getElementById('pendingOnGroup');
      if (state === 'Pending on user') {
        group.classList.add('show');
      } else {
        group.classList.remove('show');
      }
    }

    function resetForm() {
      document.getElementById('ticketForm').reset();
      document.getElementById('editId').value = '';
      document.getElementById('formTitle').textContent = 'Create New Ticket';
      document.getElementById('submitBtn').textContent = 'Create Ticket';
      document.getElementById('state').disabled = false;
      document.getElementById('pendingOnGroup').classList.remove('show');
      switchTab('create');
    }

    function editTicket(id) {
      const ticket = tickets.find(t => t.id === id);
      if (!ticket) return;
      if (ticket.state === 'Closed') { alert('Closed tickets cannot be edited.'); return; }
      document.getElementById('editId').value = id;
      document.getElementById('summary').value = ticket.summary;
      document.getElementById('description').value = ticket.description || '';
      document.getElementById('assignee').value = ticket.assignee || '';
      document.getElementById('eta').value = ticket.eta || '';
      document.getElementById('state').value = ticket.state;
      document.getElementById('pendingOn').value = ticket.pendingOn || '';
      document.getElementById('impediment').value = ticket.impediment || '';
      document.getElementById('formTitle').textContent = 'Edit Ticket';
      document.getElementById('submitBtn').textContent = 'Update Ticket';
      togglePendingOn();
      switchTab('create');
    }

    function saveTicket(e) {
      e.preventDefault();
      const id = document.getElementById('editId').value;
      const summary = document.getElementById('summary').value.trim();
      if (!summary) { alert('Summary is required.'); return; }
      const description = document.getElementById('description').value.trim();
      const assignee = document.getElementById('assignee').value.trim();
      const eta = document.getElementById('eta').value;
      let state = document.getElementById('state').value;
      const impediment = document.getElementById('impediment').value.trim();
      const pendingOn = document.getElementById('pendingOn').value.trim();

      if (id) {
        const ticket = tickets.find(t => t.id === id);
        if (!ticket) return;
        if (ticket.state === 'Closed') { alert('Cannot edit a closed ticket.'); return; }
        updateTicket(id, { summary, description, assignee, eta, state, impediment, pendingOn });
      } else {
        createTicket({ summary, description, assignee, eta, state, impediment, pendingOn });
      }
      resetForm();
      refreshDashboard();
      renderTable();
      switchTab('dashboard');
    }

    // -------- Detail Modal with Comments --------
    function openDetail(id) {
      const ticket = tickets.find(t => t.id === id);
      if (!ticket) return;
      const modal = document.getElementById('detailModal');
      const content = document.getElementById('detailContent');
      const commentsHtml = ticket.comments.map(c => `
        <div class="comment">
          <div>${c.text}</div>
          <div class="meta">${c.user} – ${new Date(c.timestamp).toLocaleString()}</div>
        </div>
      `).join('');

      content.innerHTML = `
        <div class="flex-between">
          <h3>${ticket.id}</h3>
          <button class="btn btn-outline btn-sm" onclick="closeModal()">✕</button>
        </div>
        <p><strong>Summary:</strong> ${ticket.summary}</p>
        <p><strong>Description:</strong> ${ticket.description || 'None'}</p>
        <p><strong>Assignee:</strong> ${ticket.assignee || 'Unassigned'}</p>
        <p><strong>State:</strong> <span class="state-badge state-${ticket.state.toLowerCase().replace(/ /g,'')}">${ticket.state}</span></p>
        ${ticket.state === 'Pending on user' ? `<p><strong>Pending on:</strong> ${ticket.pendingOn || 'Not specified'}</p>` : ''}
        <p><strong>ETA:</strong> ${ticket.eta || '-'}</p>
        <p><strong>Created:</strong> ${new Date(ticket.createTime).toLocaleString()}</p>
        <p><strong>Completed:</strong> ${ticket.completedTime ? new Date(ticket.completedTime).toLocaleString() : 'Not completed'}</p>
        <p><strong>Impediment:</strong> ${ticket.impediment || 'None'}</p>
        <hr>
        <h4>💬 Comments</h4>
        <div id="commentsContainer">${commentsHtml}</div>
        <div class="flex gap-2 mt-2">
          <input type="text" id="newCommentInput" placeholder="Add a comment..." style="flex:1; padding:8px 12px; border:1px solid #e2e8f0; border-radius:12px;">
          <button class="btn btn-primary btn-sm" onclick="addCommentFromDetail('${ticket.id}')">Add</button>
        </div>
        <div class="flex gap-2 mt-4">
          <button class="btn btn-primary btn-sm" onclick="editTicket('${ticket.id}'); closeModal();">Edit</button>
          <button class="btn btn-danger btn-sm" onclick="deleteTicket('${ticket.id}'); closeModal(); refreshDashboard(); renderTable();">Delete</button>
          <button class="btn btn-outline btn-sm" onclick="closeModal()">Close</button>
        </div>
      `;
      modal.classList.add('open');
    }

    function addCommentFromDetail(ticketId) {
      const input = document.getElementById('newCommentInput');
      const text = input.value.trim();
      if (!text) return;
      addComment(ticketId, text);
      input.value = '';
      openDetail(ticketId);
    }

    function closeModal() {
      document.getElementById('detailModal').classList.remove('open');
    }

    // -------- Profile --------
    function showProfileModal() {
      document.getElementById('profileName').value = currentUser || '';
      document.getElementById('profileModal').classList.add('open');
    }

    function closeProfileModal() {
      document.getElementById('profileModal').classList.remove('open');
    }

    function saveProfile() {
      const name = document.getElementById('profileName').value.trim();
      if (name) {
        currentUser = name;
        localStorage.setItem(PROFILE_KEY, name);
      }
      closeProfileModal();
    }

    // -------- First-time name prompt --------
    function showNamePrompt() {
      document.getElementById('namePromptModal').classList.add('open');
    }

    function saveNameFromPrompt() {
      const name = document.getElementById('namePromptInput').value.trim();
      if (name) {
        currentUser = name;
        localStorage.setItem(PROFILE_KEY, name);
        document.getElementById('namePromptModal').classList.remove('open');
      } else {
        alert('Please enter your name.');
      }
    }

    // -------- Tab --------
    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
      document.querySelector(`.tab[data-tab="${tab}"]`).classList.add('active');
      document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
      document.getElementById(`page-${tab}`).classList.add('active');
      if (tab === 'dashboard') refreshDashboard();
      if (tab === 'tickets') renderTable();
    }

    // -------- Export with timestamped filename --------
    function exportData() {
      const now = new Date();
      const date = now.toISOString().slice(0,10);
      const time = now.toTimeString().slice(0,8).replace(/:/g, '-');
      const filename = `Export_${date}_${time}.json`;

      const data = JSON.stringify(tickets, null, 2);
      const blob = new Blob([data], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      a.click();
      URL.revokeObjectURL(a.href);
    }

    // -------- Refresh --------
    function refreshDashboard() {
      applyLifecycle();
      renderStats();
      renderDashboard();
    }

    // -------- Init --------
    function initApp() {
      loadData();
      if (!currentUser) {
        setTimeout(() => {
          showNamePrompt();
        }, 300);
      }
      if (!localStorage.getItem(COUNTER_KEY)) {
        const maxNum = tickets.reduce((max, t) => {
          const num = parseInt(t.id.replace('TKT-',''), 10);
          return isNaN(num) ? max : Math.max(max, num);
        }, 0);
        localStorage.setItem(COUNTER_KEY, String(maxNum));
      }
      refreshDashboard();
      renderTable();
      checkEtaNotifications();
      setInterval(() => {
        checkEtaNotifications();
      }, 86400000);
      setInterval(() => {
        refreshDashboard();
        if (document.getElementById('page-tickets').classList.contains('active')) renderTable();
      }, 120000);
      document.getElementById('detailModal').addEventListener('click', function(e) {
        if (e.target === this) closeModal();
      });
      document.getElementById('profileModal').addEventListener('click', function(e) {
        if (e.target === this) closeProfileModal();
      });
      document.getElementById('etaNotificationModal').addEventListener('click', function(e) {
        if (e.target === this) closeEtaNotification();
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') { closeModal(); closeProfileModal(); closeEtaNotification(); }
      });
      document.getElementById('customDateRange').style.display = 'none';
    }

    function closeEtaNotification() {
      document.getElementById('etaNotificationModal').classList.remove('open');
    }

    // Expose globals
    window.switchTab = switchTab;
    window.refreshDashboard = refreshDashboard;
    window.exportData = exportData;
    window.resetForm = resetForm;
    window.saveTicket = saveTicket;
    window.editTicket = editTicket;
    window.deleteTicket = deleteTicket;
    window.openDetail = openDetail;
    window.closeModal = closeModal;
    window.logout = logout;
    window.initApp = initApp;
    window.togglePendingOn = togglePendingOn;
    window.showProfileModal = showProfileModal;
    window.closeProfileModal = closeProfileModal;
    window.saveProfile = saveProfile;
    window.saveNameFromPrompt = saveNameFromPrompt;
    window.addCommentFromDetail = addCommentFromDetail;
    window.downloadReport = downloadReport;
    window.showCustomReport = showCustomReport;
    window.toggleDateFilter = toggleDateFilter;
    window.closeEtaNotification = closeEtaNotification;

    if (document.body.classList.contains('logged-in')) {
      initApp();
    }
  </script>
</body>
</html>
